<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard {
            border: 1px solid #ccc;
            padding: 20px;
            width: 80%;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            display: none; /* Hide all sections by default */
        }

        .dashboard.active {
            display: block; /* Show section when active */
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }

        label {
            margin-bottom: 5px;
        }

        input,
        select {
            padding: 8px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f0f0f0;
        }

        .total-expenses {
            text-align: right;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .search-section {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }

        .search-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 10px;
        }

        .search-group .form-group {
            flex: 1;
            min-width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Expense Tracker Dashboard</h2>

        <!-- Main Page with Buttons -->
        <div id="mainPage">
            <button class="btn" onclick="showAddExpense()">Add Expense</button>
            <button class="btn" onclick="showViewExpense()">View Expense</button>
        </div>

        <!-- Add Expense Section -->
        <div id="addExpenseSection" class="dashboard">
            <h3>Add Expense</h3>
            <div class="form-group">
                <label for="expenseName">Expense Name:</label>
                <input type="text" id="expenseName" placeholder="Enter Expense Name" />
            </div>

            <div class="form-group">
                <label for="expenseCategory">Expense Category:</label>
                <select id="expenseCategory">
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Hotels">Hotels</option>
                    <option value="Rent">Rent</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Bills">Bills</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Essentials">Essentials</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Internet">Internet</option>
                    <option value="Taxes">Taxes</option>
                    <option value="Parties">Parties</option>
                </select>
            </div>

            <div class="form-group">
                <label for="amount">Amount (₹):</label>
                <input type="number" id="amount" placeholder="Enter Amount in ₹" />
            </div>

            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" />
            </div>

            <button class="btn" onclick="addExpense()">Add Expense</button>
            <button class="btn" onclick="backToMainPage()">Back to Main Page</button>
        </div>

        <!-- View Expense Section -->
        <div id="viewExpenseSection" class="dashboard">
            <h3>View Expenses</h3>
            <div class="search-section">
                <h4>Search & Filter</h4>
                <div class="search-group">
                    <div class="form-group">
                        <label for="searchName">Search by Expense Name:</label>
                        <input type="text" id="searchName" placeholder="Enter Expense Name" oninput="applyFilters()" />
                    </div>

                    <div class="form-group">
                        <label for="searchDate">Search by Date:</label>
                        <input type="date" id="searchDate" onchange="applyFilters()" />
                    </div>

                    <div class="form-group">
                        <label for="searchMonth">Search by Month:</label>
                        <input type="month" id="searchMonth" onchange="applyFilters()" />
                    </div>

                    <div class="form-group">
                        <label for="searchCategory">Search by Category:</label>
                        <select id="searchCategory" onchange="applyFilters()">
                            <option value="">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Hotels">Hotels</option>
                            <option value="Rent">Rent</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Bills">Bills</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Essentials">Essentials</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Internet">Internet</option>
                            <option value="Taxes">Taxes</option>
                            <option value="Parties">Parties</option>
                        </select>
                    </div>
                </div>

                <table id="expensesTable">
                    <thead>
                        <tr>
                            <th>Sr. No.</th>
                            <th>Expense Category</th>
                            <th>Expense Name</th>
                            <th>Amount (₹)</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dynamic content will go here -->
                    </tbody>
                </table>

                <div class="total-expenses" id="totalAmount">Total Amount: ₹0.00</div>
            </div>

            <button class="btn" onclick="clearFilters()">Clear Filters</button>
            <button class="btn" onclick="backToMainPage()">Back to Main Page</button>
        </div>
    </div>

    <script>
        let expenses = [];
        let totalAmount = 0;

        function showAddExpense() {
            // Hide Main Page, show Add Expense Section
            document.getElementById("mainPage").style.display = "none";
            document.getElementById("addExpenseSection").classList.add("active");
            document.getElementById("viewExpenseSection").classList.remove("active");
        }

        function showViewExpense() {
            // Hide Main Page, show View Expense Section
            document.getElementById("mainPage").style.display = "none";
            document.getElementById("viewExpenseSection").classList.add("active");
            document.getElementById("addExpenseSection").classList.remove("active");
            updateExpensesTable(expenses);
        }

        function backToMainPage() {
            // Show Main Page and hide both sections
            document.getElementById("mainPage").style.display = "block";
            document.getElementById("addExpenseSection").classList.remove("active");
            document.getElementById("viewExpenseSection").classList.remove("active");
        }

        function addExpense() {
            const expenseName = document.getElementById("expenseName").value.trim();
            const expenseCategory = document.getElementById("expenseCategory").value;
            const amountValue = document.getElementById("amount").value;
            const amount = parseFloat(amountValue);
            const date = document.getElementById("date").value;

            if (expenseName && expenseCategory && amountValue && !isNaN(amount) && date) {
                const expense = {
                    id: expenses.length + 1,
                    name: expenseName,
                    category: expenseCategory,
                    amount: amount,
                    date: date,
                };

                expenses.push(expense);
                totalAmount += amount;

                updateExpensesTable(expenses);
                clearForm();
            } else {
                alert("Please fill all fields correctly.");
            }
        }

        function updateExpensesTable(filteredExpenses) {
            const tbody = document.querySelector("#expensesTable tbody");
            tbody.innerHTML = "";

            filteredExpenses.forEach((expense, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${expense.category}</td>
                    <td>${expense.name}</td>
                    <td>₹${expense.amount}</td>
                    <td>${expense.date}</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById("totalAmount").innerText = `Total Amount: ₹${totalAmount.toFixed(2)}`;
        }

        function clearForm() {
            document.getElementById("expenseName").value = "";
            document.getElementById("expenseCategory").value = "Food";
            document.getElementById("amount").value = "";
            document.getElementById("date").value = "";
        }

        function applyFilters() {
            const searchName = document.getElementById("searchName").value.toLowerCase();
            const searchDate = document.getElementById("searchDate").value;
            const searchMonth = document.getElementById("searchMonth").value;
            const searchCategory = document.getElementById("searchCategory").value;

            let filteredExpenses = expenses;

            if (searchName) {
                filteredExpenses = filteredExpenses.filter(expense =>
                    expense.name.toLowerCase().includes(searchName)
                );
            }

            if (searchDate) {
                filteredExpenses = filteredExpenses.filter(expense =>
                    expense.date === searchDate
                );
            }

            if (searchMonth) {
                filteredExpenses = filteredExpenses.filter(expense =>
                    expense.date.startsWith(searchMonth)
                );
            }

            if (searchCategory) {
                filteredExpenses = filteredExpenses.filter(expense =>
                    expense.category === searchCategory
                );
            }

            updateExpensesTable(filteredExpenses);
        }

        function clearFilters() {
            document.getElementById("searchName").value = "";
            document.getElementById("searchDate").value = "";
            document.getElementById("searchMonth").value = "";
            document.getElementById("searchCategory").value = "";

            updateExpensesTable(expenses);
        }
    </script>
</body>
</html>
